<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{{ settings.shop_name }}{% endblock %}</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1b1f24; --muted:#5f6b7a; --line:#e3e6ea;
          --brand:#0b63ce; --ok:#12805c; --warn:#b35c00; --bad:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b2027; --text:#e8ebef; --muted:#9aa5b1; --line:#2c333c;
            --brand:#5aa2ff; --ok:#3ecf8e; --warn:#ffb454; --bad:#ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
  .wide { max-width: 1100px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:13px; }
  .big { font-size:28px; font-weight:700; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px;
         padding:8px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row b { word-break: break-all; text-align:right; }
  button, .btn { display:inline-block; border:0; border-radius:8px; padding:10px 14px; font:inherit;
         background:var(--brand); color:#fff; cursor:pointer; text-decoration:none; text-align:center; }
  .btn.block { display:block; width:100%; margin:6px 0; }
  .btn.ghost, button.ghost { background:transparent; color:var(--brand); border:1px solid var(--line); padding:4px 10px; }
  .state { border-radius:12px; padding:20px; text-align:center; font-weight:600; }
  .state.ok { background:color-mix(in srgb, var(--ok) 15%, transparent); color:var(--ok); }
  .state.bad { background:color-mix(in srgb, var(--bad) 15%, transparent); color:var(--bad); }
  .state.warn { background:color-mix(in srgb, var(--warn) 15%, transparent); color:var(--warn); }
  .center { text-align:center; }
  img.qr { width: 240px; max-width:100%; background:#fff; padding:8px; border-radius:8px; }
  input, select { font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line);
         background:var(--bg); color:var(--text); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .table-scroll { overflow-x:auto; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
