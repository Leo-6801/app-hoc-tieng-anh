name: Leo Connect APK

on:
  push:
    paths:
      - "leo-connect/**"
      - ".github/workflows/leo-connect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leo-connect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Đặt tên file
        run: cp app/build/outputs/apk/release/app-release.apk "LeoConnect-v0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LeoConnect-v0.1.${{ github.run_number }}
          path: leo-connect/LeoConnect-v0.1.${{ github.run_number }}.apk

      - name: Tạo bản phát hành để tải APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: leo-connect-v0.1.${{ github.run_number }}
          name: Leo Connect v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: leo-connect/LeoConnect-v0.1.${{ github.run_number }}.apk
          body: |
            Bản build tự động của Leo Connect (điều khiển điện thoại từ máy tính bảng qua Tailscale).
            Tải file **LeoConnect-v0.1.${{ github.run_number }}.apk** bên dưới và cài trên CẢ điện thoại và máy tính bảng.
            Hướng dẫn: leo-connect/README.md
