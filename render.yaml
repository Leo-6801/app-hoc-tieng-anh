# Cấu hình Render (Blueprint) cho bản THỬ NGHIỆM của Web QR (thư mục web-qr/).
# Render tự cấp link https://<tên>.onrender.com. Gói free: ngủ khi không dùng, mất dữ liệu khi khởi động lại.
services:
  - type: web
    name: web-qr-thu
    runtime: python
    plan: free
    branch: ccr-cc07d8bd-mypsqs
    rootDir: web-qr
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_MODE
        value: "1"
      - key: SHOP_NAME
        value: Cửa hàng thử nghiệm
      - key: DEFAULT_EXPIRE_MINUTES
        value: "15"
      - key: DB_PATH
        value: /tmp/webqr.db
      - key: BANK_APPS
        value: vcb:Vietcombank,mb:MB Bank,icb:VietinBank,bidv:BIDV,tcb:Techcombank,acb:ACB
      # Render sẽ hỏi các giá trị dưới đây khi tạo (sync: false)
      - key: BANK_BIN
        sync: false
      - key: BANK_NAME
        sync: false
      - key: ACCOUNT_NUMBER
        sync: false
      - key: ACCOUNT_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Render tự sinh chuỗi ngẫu nhiên
      - key: ADMIN_API_KEY
        generateValue: true
      - key: READER_SECRET
        generateValue: true
